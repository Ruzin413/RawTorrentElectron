# CI/CD for RawTorrent.
#
# CI  - every push to main and every pull request: check the code, then build the
#       Windows installer and Linux AppImage/.deb and attach them to the run as artifacts.
# CD  - pushing a version tag (git tag v1.0.1 && git push origin v1.0.1) runs the same
#       build with that version and publishes a GitHub Release with the installers.
# The pipeline can also be started by hand from the Actions tab (no release).
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch/PR cancels the older run; tag builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for f in main.js renderer.js scripts/*.js; do
            node --check "$f"
          done

      - name: Build .NET backend
        run: dotnet build RawTorrent/TorServices/TorServices/TorServices.csproj -c Release

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            backend: publish:backend:win
            builder_args: --win --x64
            files: |
              dist-installer/*.exe
              dist-installer/*.exe.blockmap
          - name: Linux
            os: ubuntu-latest
            backend: publish:backend:linux
            builder_args: --linux --x64
            files: |
              dist-installer/*.AppImage
              dist-installer/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Publish .NET backend
        run: npm run ${{ matrix.backend }}

      - name: Package app
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: RawTorrent-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: RawTorrent ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
          fail_on_unmatched_files: true
