# Builds RawTorrent for Windows and Linux and publishes a GitHub Release.
#
# Release:      push a version tag, e.g.  git tag v1.0.1 && git push origin v1.0.1
#               The tag sets the app version and the release name.
# Test build:   run "Build & Release" manually from the Actions tab; the installers
#               are attached to the run as artifacts and no release is created.
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            backend: publish:backend:win
            builder_args: --win --x64
            files: |
              dist-installer/*.exe
              dist-installer/*.exe.blockmap
          - name: Linux
            os: ubuntu-latest
            backend: publish:backend:linux
            builder_args: --linux --x64
            files: |
              dist-installer/*.AppImage
              dist-installer/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Publish .NET backend
        run: npm run ${{ matrix.backend }}

      - name: Package app
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: RawTorrent-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: RawTorrent ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
          fail_on_unmatched_files: true
